# Render blueprint for the FORGE API (forge-gym/api/).
#
# The FORGE sites stay on their existing static hosting. This adds the Node
# service that every portal, the website demo and the Flutter app talk to.
# In Render: New > Blueprint, pick this repository, then enter MONGODB_URI
# when asked.
#
# After it is live, set VITE_API_URL on each static site (and
# --dart-define=API_BASE_URL for the Flutter app) to this service's address,
# then redeploy (see forge-gym/README.md).
services:
  - type: web
    name: forge-gym-api
    runtime: node
    plan: free
    rootDir: forge-gym/api
    # Production packages only: skips the development database download.
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # MongoDB Atlas connection string. Entered in the dashboard, never stored in the repo.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: gym
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated site addresses allowed to call this API.
      - key: CORS_ORIGIN
        value: https://demo-web-forge-gym.onrender.com
